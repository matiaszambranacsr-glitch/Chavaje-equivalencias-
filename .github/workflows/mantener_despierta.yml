# Visita la app cada cuatro horas para que Streamlit no la ponga a dormir, y la despierta si
# está dormida. Si no levanta, el trabajo falla y GitHub manda un mail: es la alarma de «la app
# está caída». Ver .github/despertar_la_app.py.
# Se puede correr a mano desde la pestaña Actions → «Mantener la app despierta» → Run workflow.
name: Mantener la app despierta

on:
  # Estuvo en pausa porque la dirección que tenía (elchavo.streamlit.app) no era la de la app:
  # GitHub veía «You do not have access to this app or it does not exist». La de verdad es
  # equivalenciasdelchavo.streamlit.app.
  schedule:
    - cron: "7 */4 * * *"     # cada 4 horas (en hora UTC), a los 7 minutos
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar el navegador
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Abrir la app
        run: python .github/despertar_la_app.py
        env:
          # La dirección se cambia sin tocar código: GitHub → Settings → Secrets and variables
          # → Actions → Variables → «URL_DE_LA_APP».
          URL_DE_LA_APP: ${{ vars.URL_DE_LA_APP || 'https://equivalenciasdelchavo.streamlit.app/' }}
      - name: Guardar la captura si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lo-que-se-vio
          path: lo_que_se_vio.png
          if-no-files-found: ignore
