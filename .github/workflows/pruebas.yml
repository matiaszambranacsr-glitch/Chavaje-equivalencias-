# El auditor y todas las pruebas, en cada subida a main y a las ramas de trabajo. Si algo falla,
# GitHub lo marca en rojo (la ✗ al lado del cambio) y le manda un mail a quien lo subió. Lo que
# corre está en .github/correr_las_pruebas.py, que también se puede correr a mano.
#
# No corre en la rama «copia-de-seguridad»: ahí la app sube la copia de la base cada vez que
# cambia, y cada subida gastaría minutos de GitHub sin probar nada. Tampoco cuando solo cambia
# un .md. Con el repositorio privado, GitHub da 2.000 minutos gratis por mes.
name: Pruebas

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Dos subidas seguidas a la misma rama: la primera se cancela, importa la última.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar las librerías
        run: pip install -r requirements.txt
      - name: Auditor y pruebas
        run: python .github/correr_las_pruebas.py
      # Las mismas, con el reloj a las 22:30 de Argentina: a esa hora el día UTC ya es el
      # siguiente, y lo que corta el día con el reloj equivocado falla solo de noche. Ver
      # «CON EL RELOJ EN OTRO MOMENTO» en .github/correr_las_pruebas.py.
      - name: Las mismas pruebas, de noche
        run: |
          sudo apt-get install -y faketime
          python .github/correr_las_pruebas.py --de-noche

  # LO QUE CORRE EN EL NAVEGADOR: el cursor en la caja de búsqueda para el lector de códigos de
  # barras, F1, F2, F9, F10, el click derecho y los textos en castellano. Ninguna de las pruebas
  # de arriba lo ve (corren la app sin navegador), y esta se corría solo a mano. Así, al sumar
  # la burbuja del asistente el cursor dejó de quedar en la búsqueda de Ventas y pasaron seis
  # subidas sin que nadie se enterara. Va en su propio trabajo, a la par del otro: no lo demora.
  # La versión de Playwright es la misma que en mantener_despierta.yml.
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar las librerías y el navegador
        run: |
          pip install -r requirements.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Lo que corre en el navegador
        run: python pruebas/navegador.py --sin-saltear
